openapi: 3.1.0
info:
  title: DEVLINK API
  description: API service for the Distributed Link Intelligence Platform.
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register a user
      description: Create a password-backed user account using a normalized email.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Register Api V1 Auth Register Post
        '401':
          description: Invalid or expired credentials.
        '409':
          description: The requested account already exists.
        '422':
          description: Request validation failed.
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Log in
      description: Verify password credentials and issue JWT access/refresh tokens.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired credentials.
        '409':
          description: The requested account already exists.
        '422':
          description: Request validation failed.
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh tokens
      description: Rotate a refresh token and return a new access/refresh token pair.
        The previous refresh token is revoked.
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired credentials.
        '409':
          description: The requested account already exists.
        '422':
          description: Request validation failed.
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Log out
      description: Revoke a refresh token so it can no longer be rotated.
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '401':
          description: Invalid or expired credentials.
        '409':
          description: The requested account already exists.
        '422':
          description: Request validation failed.
  /api/v1/auth/oauth/google:
    get:
      tags:
      - auth
      summary: Start Google OAuth
      description: Placeholder endpoint for a future Google OAuth authorization flow.
      operationId: start_google_oauth_api_v1_auth_oauth_google_get
      responses:
        '501':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Start Google Oauth Api V1 Auth Oauth Google Get
        '401':
          description: Invalid or expired credentials.
        '409':
          description: The requested account already exists.
        '422':
          description: Request validation failed.
  /api/v1/auth/oauth/google/callback:
    get:
      tags:
      - auth
      summary: Finish Google OAuth
      description: Placeholder callback endpoint for a future Google OAuth flow.
      operationId: finish_google_oauth_api_v1_auth_oauth_google_callback_get
      responses:
        '501':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Finish Google Oauth Api V1 Auth Oauth Google Callback
                  Get
        '401':
          description: Invalid or expired credentials.
        '409':
          description: The requested account already exists.
        '422':
          description: Request validation failed.
  /api/v1/links:
    post:
      tags:
      - links
      summary: Create a short link
      description: Create a short link for the authenticated user. Duplicate normalized
        URLs are deduplicated unless a custom alias is requested.
      operationId: create_link_api_v1_links_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
    get:
      tags:
      - links
      summary: List links
      description: List links visible to the authenticated user with offset pagination.
      operationId: list_links_api_v1_links_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkResponse'
                title: Response List Links Api V1 Links Get
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /api/v1/links/bulk:
    post:
      tags:
      - links
      summary: Bulk-create short links
      description: Shorten up to 50 URLs and return per-item success/error results.
        Partial failures do not fail the whole request.
      operationId: bulk_create_links_api_v1_links_bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLinkCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLinkCreateResponse'
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
      security:
      - OAuth2PasswordBearer: []
  /api/v1/links/{short_code}/qr:
    get:
      tags:
      - links
      summary: Get link QR code
      description: Return a cached PNG or SVG QR code for a public redirect URL. This
        endpoint is public but only returns QR codes for available links.
      operationId: get_link_qr_api_v1_links__short_code__qr_get
      parameters:
      - name: short_code
        in: path
        required: true
        schema:
          type: string
          title: Short Code
      - name: image_format
        in: query
        required: false
        schema:
          type: string
          pattern: ^(png|svg)$
          default: png
          title: Image Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /api/v1/links/{link_id}:
    get:
      tags:
      - links
      summary: Get a link
      description: Return one link by numeric ID if the authenticated user can access
        it.
      operationId: get_link_api_v1_links__link_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
    patch:
      tags:
      - links
      summary: Update a link
      description: Update link metadata, destination, alias, password, active state,
        or expiration. Destination changes trigger a new asynchronous safety check.
      operationId: update_link_api_v1_links__link_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
    delete:
      tags:
      - links
      summary: Soft-delete a link
      description: Mark a link inactive and invalidate redirect cache entries.
      operationId: delete_link_api_v1_links__link_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: Invalid alias, URL, expiration, or request payload.
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link/workspace.
        '404':
          description: Link not found.
        '409':
          description: Custom alias already exists.
        '410':
          description: The public link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /api/v1/analytics/{link_id}/summary:
    get:
      tags:
      - analytics
      summary: Get analytics summary
      description: Return total clicks for a link using the denormalized link counter.
        Unique clicks are not tracked yet and are reported as unavailable.
      operationId: get_summary_api_v1_analytics__link_id__summary_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link.
        '404':
          description: Link not found.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /api/v1/analytics/{link_id}/timeseries:
    get:
      tags:
      - analytics
      summary: Get click time series
      description: Return daily click counts for a link from the aggregate analytics
        table. Dashboard queries never read raw click events.
      operationId: get_timeseries_api_v1_analytics__link_id__timeseries_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          title: To
      - name: granularity
        in: query
        required: false
        schema:
          const: day
          type: string
          default: day
          title: Granularity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesResponse'
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link.
        '404':
          description: Link not found.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /api/v1/analytics/{link_id}/geo:
    get:
      tags:
      - analytics
      summary: Get geo breakdown
      description: Return aggregated click counts grouped by country.
      operationId: get_geo_api_v1_analytics__link_id__geo_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownResponse'
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link.
        '404':
          description: Link not found.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /api/v1/analytics/{link_id}/devices:
    get:
      tags:
      - analytics
      summary: Get device breakdown
      description: Return aggregated click counts grouped by device, browser, and
        OS.
      operationId: get_devices_api_v1_analytics__link_id__devices_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBreakdownResponse'
        '401':
          description: Authentication is required.
        '403':
          description: The current user cannot access this link.
        '404':
          description: Link not found.
        '422':
          description: Request validation failed.
        '429':
          description: Rate limit exceeded.
  /r/{short_code}:
    get:
      tags:
      - redirect
      summary: Resolve a short code
      description: Public redirect hot path. Looks up link metadata from Redis first,
        falls back to PostgreSQL, records a non-blocking click event, and returns
        a temporary redirect when the link is active.
      operationId: redirect_short_code_r__short_code__get
      parameters:
      - name: short_code
        in: path
        required: true
        schema:
          type: string
          title: Short Code
      - name: redirect_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Redirect Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Password-protected redirect token is missing or invalid.
        '403':
          description: Link is blocked for safety reasons.
        '404':
          description: Short code not found.
        '410':
          description: Link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Redirect or password verification rate limit exceeded.
  /r/{short_code}/verify:
    post:
      tags:
      - redirect
      summary: Verify a protected redirect
      description: Verify a password for a protected short link and return a short-lived
        redirect token. Attempts are rate-limited.
      operationId: verify_redirect_password_r__short_code__verify_post
      parameters:
      - name: short_code
        in: path
        required: true
        schema:
          type: string
          title: Short Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordVerifyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordVerifyResponse'
        '401':
          description: Password-protected redirect token is missing or invalid.
        '403':
          description: Link is blocked for safety reasons.
        '404':
          description: Short code not found.
        '410':
          description: Link is inactive or expired.
        '422':
          description: Request validation failed.
        '429':
          description: Redirect or password verification rate limit exceeded.
  /api/v1/workspaces:
    get:
      tags:
      - workspaces
      summary: List workspaces
      description: List all workspaces where the authenticated user is a member.
      operationId: list_workspaces_api_v1_workspaces_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkspaceResponse'
                type: array
                title: Response List Workspaces Api V1 Workspaces Get
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - workspaces
      summary: Create a workspace
      description: Create a workspace and make the authenticated user its owner.
      operationId: create_workspace_api_v1_workspaces_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
      security:
      - OAuth2PasswordBearer: []
  /api/v1/workspaces/{workspace_id}:
    get:
      tags:
      - workspaces
      summary: Get a workspace
      description: Return workspace metadata for users with at least viewer access.
      operationId: get_workspace_api_v1_workspaces__workspace_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
    patch:
      tags:
      - workspaces
      summary: Update a workspace
      description: Update workspace metadata. Requires admin or owner role.
      operationId: update_workspace_api_v1_workspaces__workspace_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
    delete:
      tags:
      - workspaces
      summary: Delete a workspace
      description: Delete a workspace. Requires owner role.
      operationId: delete_workspace_api_v1_workspaces__workspace_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
  /api/v1/workspaces/{workspace_id}/members:
    post:
      tags:
      - workspaces
      summary: Add a workspace member
      description: Add a user to a workspace. Requires admin or owner role.
      operationId: add_member_api_v1_workspaces__workspace_id__members_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
    get:
      tags:
      - workspaces
      summary: List workspace members
      description: List workspace members. Requires at least viewer role.
      operationId: list_members_api_v1_workspaces__workspace_id__members_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMemberResponse'
                title: Response List Members Api V1 Workspaces  Workspace Id  Members
                  Get
        '401':
          description: Authentication is required.
        '403':
          description: Required workspace role is missing.
        '404':
          description: Workspace or member not found.
        '409':
          description: Workspace membership already exists.
        '422':
          description: Request validation failed.
  /api/v1/workspaces/{workspace_id}/members/{user_id}:
    patch:
      tags:
      - workspaces
      summary: Update a workspace member
      description: Change a member role. Requires admin or owner role.
      operationId: update_member_api_v1_workspaces__workspace_id__members__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Workspace Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMemberResponse'
        '401':
          description: Authentication is required.
        '403':
