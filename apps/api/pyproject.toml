[tool.poetry]
name = "devlink-api"
version = "0.1.0"
description = "FastAPI service for the Distributed Link Intelligence Platform."
authors = ["DEVLINK Team"]
readme = "README.md"
packages = [{ include = "app" }, { include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic-settings = "^2.4.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.30" }
asyncpg = "^0.29.0"
alembic = "^1.13.2"
PyJWT = "^2.10.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
redis = "^7.0.0"
aiokafka = "^0.12.0"
qrcode = { extras = ["pil"], version = "^8.2" }
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.6.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
fakeredis = "^2.26.0"
testcontainers = { extras = ["postgres"], version = "^4.8.0" }

[tool.poetry.scripts]
devlink-api = "app.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a migrated PostgreSQL database",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
include = [
    "src/shared/id_generator.py",
    "src/shared/url_utils.py",
    "src/links/service.py",
    "src/auth/service.py",
]
