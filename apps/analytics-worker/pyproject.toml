[tool.poetry]
name = "devlink-analytics-worker"
version = "0.1.0"
description = "Analytics event consumer for the Distributed Link Intelligence Platform."
authors = ["DEVLINK Team"]
readme = "README.md"
packages = [{ include = "worker" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.6.0"
pytest = "^8.3.0"

[tool.poetry.scripts]
devlink-analytics-worker = "worker.worker:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
