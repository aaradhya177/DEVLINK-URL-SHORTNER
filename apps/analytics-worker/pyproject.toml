[tool.poetry]
name = "devlink-analytics-worker"
version = "0.1.0"
description = "Analytics event consumer for the Distributed Link Intelligence Platform."
authors = ["DEVLINK Team"]
readme = "README.md"
packages = [{ include = "worker" }]

[tool.poetry.dependencies]
python = "^3.11"
aiokafka = "^0.12.0"
asyncpg = "^0.30.0"
geoip2 = "^4.8.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.30" }
ua-parser = "^1.0.0"
prometheus-client = "^0.22.0"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.6.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
alembic = "^1.13.2"

[tool.poetry.scripts]
devlink-analytics-worker = "worker.worker:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a migrated PostgreSQL database",
]

[tool.coverage.run]
source = ["worker"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
include = ["worker/aggregator.py"]
