name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: api
            context: apps/api
          - name: analytics-worker
            context: apps/analytics-worker
          - name: web
            context: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: image_owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/devlink-${{ matrix.image.name }}:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/devlink-${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_API_SERVICE_NAME: ${{ vars.ECS_API_SERVICE_NAME }}
      ECS_WORKER_SERVICE_NAME: ${{ vars.ECS_WORKER_SERVICE_NAME }}
      ECS_WEB_SERVICE_NAME: ${{ vars.ECS_WEB_SERVICE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image owner
        id: image_owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy API
        shell: bash
        run: |
          bash infra/scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER_NAME" \
            "$ECS_API_SERVICE_NAME" \
            "api" \
            "ghcr.io/${{ steps.image_owner.outputs.owner }}/devlink-api:${{ github.sha }}"

      - name: Deploy analytics worker
        shell: bash
        run: |
          bash infra/scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER_NAME" \
            "$ECS_WORKER_SERVICE_NAME" \
            "analytics-worker" \
            "ghcr.io/${{ steps.image_owner.outputs.owner }}/devlink-analytics-worker:${{ github.sha }}"

      - name: Deploy web
        shell: bash
        run: |
          bash infra/scripts/deploy-ecs-service.sh \
            "$ECS_CLUSTER_NAME" \
            "$ECS_WEB_SERVICE_NAME" \
            "web" \
            "ghcr.io/${{ steps.image_owner.outputs.owner }}/devlink-web:${{ github.sha }}"

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_API_SERVICE_NAME" "$ECS_WORKER_SERVICE_NAME" "$ECS_WEB_SERVICE_NAME"
